version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /bootstrap/azure
      - /bootstrap/aws
      - /examples/infra/azure
      - /examples/infra/aws
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
