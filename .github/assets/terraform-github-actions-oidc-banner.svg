<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Terraform on GitHub Actions with OIDC</title>
  <desc id="desc">A signed token exchanged for a short-lived cloud session, with a gated path from plan to apply</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- Token exchange: pipeline, token, gate, two clouds -->
  <g transform="translate(580 0)">
    <!-- pipeline chevrons -->
    <g fill="#ffffff">
      <polygon points="0,132 26,132 42,150 26,168 0,168 16,150" fill-opacity="0.25"/>
      <polygon points="36,132 62,132 78,150 62,168 36,168 52,150" fill-opacity="0.45"/>
      <polygon points="72,132 98,132 114,150 98,168 72,168 88,150" fill-opacity="0.7"/>
    </g>
    <line x1="122" y1="150" x2="208" y2="150" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- signed token -->
    <g transform="translate(212 112)">
      <rect width="104" height="76" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="2"/>
      <rect x="14" y="16" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="14" y="32" width="76" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5"/>
      <rect x="14" y="48" width="40" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5"/>
      <circle cx="84" cy="54" r="10" fill="#9cc0ff"/>
      <path d="M79 54l4 4 7-8" fill="none" stroke="#0b1f4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <line x1="320" y1="150" x2="372" y2="150" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- gate / lock -->
    <g transform="translate(376 104)">
      <circle cx="46" cy="46" r="46" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2"/>
      <path d="M33 44v-9a13 13 0 0 1 26 0v9" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <rect x="27" y="44" width="38" height="28" rx="6" fill="#ffffff"/>
      <circle cx="46" cy="56" r="4" fill="#2456c8"/>
    </g>

    <!-- branches to two clouds -->
    <path d="M470 140 C 500 120, 505 90, 530 82" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M470 160 C 500 180, 505 210, 530 218" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <path d="M538 98a16 16 0 0 1-2-31.8 22 22 0 0 1 42-5.6A18 18 0 0 1 576 98z"/>
      <path d="M538 236a16 16 0 0 1-2-31.8 22 22 0 0 1 42-5.6A18 18 0 0 1 576 236z"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5">
      <circle cx="422" cy="150" r="70"/>
      <circle cx="422" cy="150" r="104"/>
    </g>
  </g>

  <!-- Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="104" font-size="15" font-weight="600" letter-spacing="3" fill-opacity="0.7">TERRAFORM · GITHUB ACTIONS · OIDC</text>
    <text x="64" y="158" font-size="46" font-weight="700">Zero-secret Terraform</text>
    <text x="64" y="202" font-size="22" fill-opacity="0.85">Plan in every pull request. Apply the reviewed</text>
    <text x="64" y="232" font-size="22" fill-opacity="0.85">plan, behind approval. On Azure and AWS.</text>
  </g>
</svg>
